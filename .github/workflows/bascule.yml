# Le jour de la sortie : dès qu'eSportly apparaît sur l'App Store, le site passe de la bêta TestFlight
# à l'App Store (.github/scripts/bascule_appstore.py), puis cette tâche se désactive toute seule.
name: Bascule App Store
on:
  schedule:
    - cron: "7 * * * *"   # chaque heure
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  actions: write
concurrency:
  group: matchs          # jamais en même temps que « Matchs du jour »
  cancel-in-progress: false
jobs:
  bascule:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Bascule si l'app est sortie
        run: python3 .github/scripts/bascule_appstore.py
      - name: Envoi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "eSportly (mise à jour automatique)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Sortie : le site passe de la bêta TestFlight à l'App Store"
          for essai in 1 2 3; do
            if git pull --rebase -q && git push; then
              gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
              gh workflow disable bascule.yml || true
              exit 0
            fi
            sleep 10
          done
          exit 1
